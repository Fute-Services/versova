<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beach Queen · Versova | Ocean Terrace Residences</title>
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stage" id="stage">
    
    <!-- Background Canvas Layer -->
    <div class="bg-layer" id="bgLayer"></div>

    <!-- Initial Intro Center Logo (ONLY orig.avif) -->
    <div class="intro-logo-container" id="introLogoContainer">
      <img src="assets/logo.avif" alt="Logo" class="intro-logo-img">
    </div>

    <!-- Top Header (ONLY OCEAN TERRACE text for phase 2 & fullscreen) -->
    <header class="brand-header" id="brandHeader">
      <div class="brand-text-block">
        <h1 class="brand-title">OCEAN TERRACE</h1>
        <span class="brand-subtitle">RESIDENCES</span>
      </div>
    </header>

    <!-- Visual Area: Circle Mask + Radiating Wave Aura + Zoom Out -->
    <div class="visual-viewport" id="visualViewport">
      <div class="radiating-aura" id="radiatingAura">
        <svg id="auraSvg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <div class="image-mask" id="imageMask">
        <img src="assets/ocean_terrace_hero.jpg" alt="Ocean Terrace Residences" class="hero-image" id="heroImg">
        <div class="image-scrim"></div>
      </div>
    </div>

    <!-- Center Hero Headline (Final Phase of Intro) -->
    <div class="hero-content" id="heroContent">
      <h2 class="hero-headline">
        <span class="line line-1">A WORLD OF VISIONARY DESIGN,</span>
        <span class="line line-2">WHERE EVERY HOME HAS</span>
        <span class="line line-3">CINEMATIC OCEAN VISTAS</span>
      </h2>
    </div>

    <!-- Liquidmorphic Enter Button (Right Side Above Replay) -->
    <div class="floating-enter-container" id="floatingEnterContainer">
      <button class="liquid-enter-btn" id="enterBtn">
        <span class="liquid-glass-glare"></span>
        <span class="golden-light-text">ENTER</span>
        <svg class="enter-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>

    <!-- ==========================================================================
         MAIN EXPLORATION VIEW (Triggered on ENTER button click)
         ========================================================================== -->
    <div class="main-explore-view" id="mainExploreView">
      
      <!-- Top Tagline -->
      <div class="explore-top-tagline" id="exploreTagline">
        <span>Beach Queen · Versova</span>
      </div>

      <!-- Center Editorial Headline -->
      <div class="explore-center-content" id="exploreCenterContent">
        <h1 class="explore-headline">A private horizon,<br>entirely your own.</h1>
        <p class="explore-subheadline">Sea-facing four-bedroom residences with only two homes on each floor.</p>
      </div>

      <!-- Left Vertical Liquidmorphic Sidebar (Exact Match to Reference Screenshot) -->
      <aside class="left-liquid-dock" id="leftLiquidDock">
        <div class="dock-pill-track vertical-left-track">
          
          <button class="nav-btn-item active" data-action="home">
            <div class="nav-icon-disc">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <span class="nav-btn-label">Home</span>
          </button>

          <button class="nav-btn-item" data-action="location">
            <div class="nav-icon-disc">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            </div>
            <span class="nav-btn-label">Location</span>
          </button>

          <button class="nav-btn-item" data-action="floorplan">
            <div class="nav-icon-disc">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            </div>
            <span class="nav-btn-label">Floor Plan</span>
          </button>

          <button class="nav-btn-item" data-action="vrtour">
            <div class="nav-icon-disc">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 10s2-4 10-4 10 4 10 4-2 6-10 6-10-6-10-6z"></path><circle cx="8" cy="10" r="2"></circle><circle cx="16" cy="10" r="2"></circle></svg>
            </div>
            <span class="nav-btn-label">VR Tour</span>
          </button>

          <button class="nav-btn-item" data-action="amenities">
            <div class="nav-icon-disc">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
            </div>
            <span class="nav-btn-label">Amenities</span>
          </button>

          <button class="nav-btn-item" data-action="media">
            <div class="nav-icon-disc">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </div>
            <span class="nav-btn-label">Media</span>
          </button>

        </div>
      </aside>

      <!-- Right Action Dock (Walkthrough, Journey, 360 View) -->
      <aside class="right-liquid-dock" id="rightLiquidDock">
        <div class="dock-pill-track vertical-right-track">
          
          <button class="nav-btn-item" data-action="walkthrough" title="Walk Through">
            <div class="nav-icon-disc">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><polyline points="21 15 16 10 5 21"></polyline></svg>
            </div>
            <span class="nav-btn-label">Walkthrough</span>
          </button>

          <button class="nav-btn-item" data-action="journey" title="Continue the Journey">
            <div class="nav-icon-disc">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </div>
            <span class="nav-btn-label">Journey</span>
          </button>

          <button class="nav-btn-item" data-action="360" id="badge360Btn" title="360° Panorama View">
            <div class="nav-icon-disc disc-360">
              <span class="text-360">360°</span>
            </div>
            <span class="nav-btn-label">View</span>
          </button>

        </div>
      </aside>

      <!-- Bottom Gallery Dock -->
      <div class="bottom-gallery-dock" id="bottomGalleryDock">
        <div class="gallery-dock-glass">
          <div class="gallery-thumb active" data-bg="assets/ocean_terrace_hero.jpg">
            <img src="assets/ocean_terrace_hero.jpg" alt="Terrace">
          </div>
          <div class="gallery-thumb" data-bg="assets/versova-coast.jpg">
            <img src="assets/versova-coast.jpg" alt="Coastline Sunset">
          </div>
          <div class="gallery-thumb" data-bg="assets/living-room.jpg">
            <img src="assets/living-room.jpg" alt="Living Room">
          </div>
          <div class="gallery-thumb" data-bg="assets/hero-bg.png">
            <img src="assets/hero-bg.png" alt="High-Rise Tower">
          </div>
        </div>

        <a href="#homes" class="explore-homes-link">
          <span>Now Explore Homes</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
      </div>

      <!-- Back to Hero Intro Button -->
      <button class="back-hero-btn" id="backHeroBtn" title="Back to Intro View">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>INTRO</span>
      </button>

    </div>

    <!-- Wave Style Selector & Replay Controls (Intro View) -->
    <div class="controls-panel" id="controlsPanel">
      <div class="style-switcher">
        <span class="switcher-label">Wave Style:</span>
        <button class="style-btn" data-style="1">1. Fluid Ribbon</button>
        <button class="style-btn" data-style="2">2. Live Visualizer</button>
        <button class="style-btn active" data-style="3">3. Concentric Ripples</button>
        <button class="style-btn" data-style="4">4. Magnetic Cursor Wave</button>
        <button class="style-btn" data-style="5">5. Sunset Glow Wave</button>
        <button class="style-btn" data-style="6">6. Ocean Foam Particles</button>
        <button class="style-btn" data-style="7">7. Nautilus Spiral</button>
        <button class="style-btn" data-style="8">8. Bioluminescent Ocean</button>
        <button class="style-btn" data-style="9">9. Coastal Tidal Swell</button>
      </div>
      <button class="replay-btn" id="replayBtn" title="Replay Animation">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span>REPLAY</span>
      </button>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>

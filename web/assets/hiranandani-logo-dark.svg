<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 68" width="260" height="68" fill="none">
  <!-- Monogram Box -->
  <g id="monogram">
    <!-- Grey Box -->
    <rect x="22" y="16" width="36" height="36" fill="#64748b" rx="2" />
    
    <!-- Arch (the 'n' curve of 'h') -->
    <path d="M 23 52 V 32 C 23 23 33 21 41 21 C 49 21 53 26 53 34 V 52 H 44 V 35 C 44 29 41 27 36 27 C 31 27 28 30 28 36 V 52 Z" fill="#ffffff" />
    
    <!-- Gold Serif 'l' (left stem of 'h') -->
    <path d="M 9 10 H 22 V 47 H 26 V 52 H 9 V 47 H 13 V 15 H 9 Z" fill="#d97706" />
  </g>

  <!-- Typography (Dark Charcoal & Warm Gold for Light Backgrounds) -->
  <g id="brand-text">
    <text x="68" y="27" font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" font-size="19" font-weight="600" fill="#0f172a" letter-spacing="1">hiranandani</text>
    <text x="68" y="44" font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" font-size="16" font-weight="500" fill="#b45309" letter-spacing="1.5">communities</text>
    <text x="7" y="62" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="500" fill="#64748b" letter-spacing="0.8">a niranjan hiranandani initiative</text>
  </g>
</svg>
